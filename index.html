.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.card p{margin:4px 0}
#sos{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;background:var(--red);border:4px solid #fff;color:#fff;font:800 22px Georgia,serif;z-index:20;overflow:hidden;padding:0;touch-action:none;user-select:none}
#sos small{display:block;font:500 10px system-ui}#sos::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:0;background:#fff6}
#sos.hold::after{animation:f 1.5s linear forwards}@keyframes f{to{height:100%}}
#gate{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}#gate .card{max-width:380px;width:100%}

 <div class="row"><input id="q" placeholder="Search a town or area" aria-label="Search area"><button id="go">Go</button><button id="dl" class="pri">Save area offline</button></div>
 <div id="dls" aria-live="polite"></div><div class="row" id="areas"></div>

 <h2>Weather and visibility</h2><div class="card" id="wx"><p>Waiting for your location…</p></div>

 <h2>Report what you see</h2><div class="grid" id="hz"></div>
 <div class="row"><button id="sense">Turn on automatic pothole sensing</button></div>
 <small class="m">Reports are saved on your phone and sync to other riders when you are back online.</small>

 <h2>Emergency contacts (up to 4)</h2><div id="cts"></div>
 <div class="row"><button id="saveC" class="pri">Save contacts</button></div><div class="err" id="cerr"></div>

 <h2>Helplines</h2><div class="row" id="nums"></div>
 <div id="sosOut" class="card" hidden></div>
</main>
<button id="sos" aria-label="Hold for 1.5 seconds to send SOS">SOS<small>hold</small></button>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== SETTINGS: paste your Firebase web-app config here ===== */
const CFG={
  firebase:{apiKey:"",authDomain:"",projectId:"",appId:""},
  sosEndpoint:"" // optional: your server URL that sends SMS automatically (Twilio/Fast2SMS)
};

const $=i=>document.getElementById(i);
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const toast=t=>{const e=$('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2600)};
const HZ={pothole:['🕳️','Pothole, broken edge or loose gravel'],bump:['🚧','Unmarked speed breaker'],water:['🌊','Waterlogging or slippery road'],
 patch:['🛢️','Sand, oil or mud patch'],dark:['🌑','Poor or missing street light'],cattle:['🐄','Cattle crossing'],ped:['🚶','Pedestrians crossing']};
const TTL={water:12,cattle:6,ped:6,patch:72}; // hours a report stays valid (default 30 days)
const NUMS=[['112','All emergencies'],['100','Police'],['101','Fire'],['102','Ambulance'],['108','Emergency ambulance'],['1033','Highway helpline (NHAI)'],['1091','Women helpline'],['1098','Childline']];
let me=null,speed=0,H=ls.get('rs_hz')||[],db=null,user=null,said={},lastWx=0,A=ls.get('rs_ar')||[];
const dist=(a,b)=>{const r=Math.PI/180;return 6371000*Math.hypot((b[1]-a[1])*r*Math.cos((a[0]+b[0])/2*r),(b[0]-a[0])*r)};

/* ---------- Map ---------- */
const map=L.map('map').setView([22.9,79],5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);let meMk=null,first=true;
function draw(){layer.clearLayers();const n=Date.now();H=H.filter(h=>n-h.ts<(TTL[h.t]||720)*36e5);
 H.forEach(h=>L.marker([h.lat,h.lng],{icon:L.divIcon({html:HZ[h.t][0],className:'em',iconSize:[26,26]})}).bindPopup(HZ[h.t][1]).addTo(layer));ls.set('rs_hz',H)}
draw();

navigator.geolocation&&navigator.geolocation.watchPosition(p=>{
 me=[p.coords.latitude,p.coords.longitude];speed=(p.coords.speed||0)*3.6;
 if(!meMk)meMk=L.circleMarker(me,{radius:9,color:'#fff',fillColor:'#4285f4',fillOpacity:1}).addTo(map);else meMk.setLatLng(me);
 if(first){map.setView(me,16);first=false}
 check();if(Date.now()-lastWx>6e5){lastWx=Date.now();weather()}
},()=>toast('Turn on location to get alerts'),{enableHighAccuracy:true,maximumAge:2000});

/* ---------- Hazards ---------- */
Object.entries(HZ).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v[0]+' '+v[1];b.onclick=()=>add(k);$('hz').appendChild(b)});
function add(t,auto){const at=me||[map.getCenter().lat,map.getCenter().lng];
 const h={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),t,lat:+at[0].toFixed(5),lng:+at[1].toFixed(5),ts:Date.now(),by:user?user.uid:'guest',auto:!!auto};
 H.push(h);draw();if(db)db.collection('hazards').doc(h.id).set(h).catch(()=>{});toast((auto?'Detected: ':'Reported: ')+HZ[t][1])}
function check(){const a=$('alert');let best=null,bd=1e9;
 H.forEach(h=>{const d=dist(me,[h.lat,h.lng]);if(d<bd){bd=d;best=h}});
 if(best&&bd<150){a.hidden=false;a.textContent=HZ[best.t][0]+' '+HZ[best.t][1]+': '+Math.round(bd)+' m ahead';
  if(!said[best.id]){said[best.id]=1;navigator.vibrate&&navigator.vibrate([200,100,200]);try{speechSynthesis.speak(new SpeechSynthesisUtterance(HZ[best.t][1]+' ahead'))}catch(e){}}}
 else a.hidden=true}

/* Automatic pothole sensing from phone motion (needs HTTPS and a mounted phone) */
let lastAuto=0;
$('sense').onclick=async()=>{try{if(DeviceMotionEvent.requestPermission&&await DeviceMotionEvent.requestPermission()!=='granted')return}catch(e){}
 addEventListener('devicemotion',e=>{const a=e.acceleration;if(!a||speed<8)return;const g=Math.hypot(a.x||0,a.y||0,a.z||0);
  if(g>12&&Date.now()-lastAuto>8000){lastAuto=Date.now();add('pothole',true)}});
 $('sense').textContent='Pothole sensing is on';$('sense').disabled=true};

/* ---------- Weather (Open-Meteo, cached for offline) ---------- */
async function weather(){let w=null,note='';
 try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${me[0]}&longitude=${me[1]}&current=precipitation,wind_gusts_10m,is_day&hourly=visibility&forecast_hours=1`);
  const j=await r.json();w={p:j.current.precipitation,g:j.current.wind_gusts_10m,day:j.current.is_day,v:j.hourly.visibility[0],ts:Date.now()};ls.set('rs_wx',w)}
 catch(e){w=ls.get('rs_wx');if(w)note=' (saved at '+new Date(w.ts).toLocaleTimeString()+', you are offline)'}
 const o=$('wx');o.innerHTML='';if(!w){o.textContent='No weather data yet. Connect to the internet once.';return}
 const L2=[];
 if(w.p>=.3)L2.push('Rain: roads are slippery and may be waterlogged. Slow down and avoid sudden braking.');
 if(w.v<1000)L2.push('Low visibility ('+Math.round(w.v)+' m) from fog, dust or heavy rain. Use low beam and keep a long gap.');
 if(w.g>=40)L2.push('Strong wind gusts ('+Math.round(w.g)+' km/h). Hold the handle firmly, take care near trucks and on flyovers.');
 if(!w.day)L2.push('Night: street lights may be poor or missing. Reduce speed and watch for unlit hazards.');
 if(!L2.length)L2.push('Conditions look fine right now.');
 L2.forEach(t=>{const p=document.createElement('p');p.textContent=t+(note&&t===L2[0]?note:'');o.appendChild(p)})}

/* ---------- Offline maps ---------- */
const tx=(lng,z)=>Math.floor((lng+180)/360*2**z),ty=(lat,z)=>{const r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z)};
$('dl').onclick=async()=>{const b=map.getBounds(),z0=map.getZoom(),urls=[];
 for(let z=z0;z<=Math.min(z0+2,17);z++)for(let x=tx(b.getWest(),z);x<=tx(b.getEast(),z);x++)for(let y=ty(b.getNorth(),z);y<=ty(b.getSouth(),z);y++)urls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
 if(urls.length>500){$('dls').textContent=`This view needs ${urls.length} tiles. Zoom in to a smaller area (max 500).`;return}
 const c=await caches.open('rs-tiles');
 for(let i=0;i<urls.length;i+=6){await Promise.all(urls.slice(i,i+6).map(u=>fetch(u,{mode:'no-cors'}).then(r=>c.put(u,r)).catch(()=>{})));$('dls').textContent=`Saving ${Math.min(urls.length,i+6)} of ${urls.length} map tiles…`}
 const name=prompt('Name this area','My area')||'Area';A.push({name,c:[map.getCenter().lat,map.getCenter().lng],z:z0});ls.set('rs_ar',A);areas();$('dls').textContent='Saved. This area now works without internet.'};
function areas(){$('areas').innerHTML='';A.forEach(a=>{const b=document.createElement('button');b.textContent='📍 '+a.name;b.onclick=()=>map.setView(a.c,a.z);$('areas').appendChild(b)})}areas();
$('go').onclick=async()=>{try{const j=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent($('q').value))).json();
 if(!j[0])return toast('Area not found');const b=j[0].boundingbox;map.fitBounds([[b[0],b[2]],[b[1],b[3]]])}catch(e){toast('Search needs internet. Pick a saved area instead.')}};

/* ---------- Emergency contacts and SOS ---------- */
NUMS.forEach(([n,t])=>{const a=document.createElement('a');a.className='btn';a.href='tel:'+n;a.textContent=n+' · '+t;$('nums').appendChild(a)});
function ctsRender(){const c=ls.get('rs_ct')||[];$('cts').innerHTML='';
 for(let i=0;i<4;i++){const r=document.createElement('div');r.className='row';r.innerHTML='<input placeholder="Name" aria-label="Contact name"><input type="tel" placeholder="+919876543210" aria-label="Mobile number">';
  r.children[0].value=(c[i]||{}).name||'';r.children[1].value=(c[i]||{}).n||'';$('cts').appendChild(r)}}ctsRender();
function readCts(){const o=[];[...$('cts').children].forEach(r=>{let n=r.children[1].value.replace(/[\s-]/g,'');if(/^\d{10}$/.test(n))n='+91'+n;
 if(/^\+\d{8,15}$/.test(n))o.push({name:r.children[0].value.trim(),n})});return o}
$('saveC').onclick=()=>{const c=readCts();ls.set('rs_ct',c);$('cerr').textContent='';
 if(db&&user)db.doc('users/'+user.uid).set({contacts:c},{merge:true}).catch(()=>{});toast(c.length+' contact(s) saved')};
function sos(){const c=readCts().length?readCts():(ls.get('rs_ct')||[]);
 if(!c.length){$('cerr').textContent='Add at least one emergency number and save it.';$('cts').scrollIntoView();return}
 const send=ll=>{const nm=user?user.displayName:'A RaahSathi rider';
  const loc=ll?`https://maps.google.com/?q=${ll[0]},${ll[1]} (${ll[0].toFixed(5)}, ${ll[1].toFixed(5)})`:'location not available, please call me';
  const msg=`SOS! ${nm} needs help. Location: ${loc}. Time: ${new Date().toLocaleString()}`,e=encodeURIComponent(msg),nums=c.map(x=>x.n).join(',');
  const o=$('sosOut');o.hidden=false;o.innerHTML='';const p=document.createElement('p');p.textContent='SOS message ready. If your messaging app did not open, tap a contact:';o.appendChild(p);
  c.forEach(x=>{const a=document.createElement('a');a.className='btn pri';a.style.margin='4px 6px 0 0';a.href=`sms:${x.n}?body=${e}`;a.textContent='SMS '+(x.name||x.n);o.appendChild(a)});
  if(CFG.sosEndpoint&&navigator.onLine)fetch(CFG.sosEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:c.map(x=>x.n),message:msg})}).catch(()=>{});
  location.href=/iPhone|iPad/.test(navigator.userAgent)?`sms:/open?addresses=${nums}&body=${e}`:`sms:${nums}?body=${e}`};
 if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>send([p.coords.latitude,p.coords.longitude]),()=>send(me),{enableHighAccuracy:true,timeout:8000,maximumAge:30000});else send(me)}
{let tm=null;const b=$('sos'),on=()=>{if(tm)return;b.classList.add('hold');tm=setTimeout(()=>{b.classList.remove('hold');tm=null;sos()},1500)},off=()=>{clearTimeout(tm);tm=null;b.classList.remove('hold')};
 b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,off));
 b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();on()}});b.addEventListener('keyup',off)}

/* ---------- Google sign-in (Firebase) and shared reports ---------- */
function ui(){const ok=user||ls.get('rs_guest');$('gate').hidden=!!ok;$('who').textContent=user?user.email:'Guest';$('out').hidden=!user}
function startDb(){if(db)return;db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
 db.collection('hazards').orderBy('ts','desc').limit(300).onSnapshot(s=>{const m=new Map(H.map(h=>[h.id,h]));s.forEach(d=>m.set(d.id,d.data()));H=[...m.values()];draw()},()=>{});
 db.doc('users/'+user.uid).get().then(d=>{if(d.exists&&d.data().contacts){ls.set('rs_ct',d.data().contacts);ctsRender()}}).catch(()=>{})}
if(CFG.firebase.apiKey){firebase.initializeApp(CFG.firebase);const a=firebase.auth();
 a.onAuthStateChanged(u=>{user=u;ui();if(u)startDb()});
 $('g').onclick=()=>a.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>$('gerr').textContent=e.message);
 $('out').onclick=()=>{ls.set('rs_guest',0);a.signOut()}}
else{$('gerr').textContent='Google sign-in is off until you add your Firebase config in app.js.';$('g').disabled=true;ui()}
$('guest').onclick=()=>{ls.set('rs_guest',1);ui()};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');

</script>
</body></html>
